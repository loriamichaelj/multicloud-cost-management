[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "costreport"
version = "0.1.0"
description = "Multi-cloud cost analysis and weekly executive Markdown reports"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
aws = ["boto3"]
azure = ["azure-identity"]
gcp = ["google-cloud-bigquery"]
all = ["boto3", "azure-identity", "google-cloud-bigquery"]

[project.scripts]
costreport = "costreport.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
costreport = ["data/*.toml"]
